[project]
name = "halo-quote-copilot"
version = "0.1.0"
description = "Practice agentic platform: governed quote drafting on AWS Bedrock"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "anthropic[bedrock]>=1.3",
    "mcp>=1.2",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
dev = [
    "python-hcl2>=4.3",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
halo = "halo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
