# Everything here runs without an AWS account and without spending anything.
# That is a property of the test suite, not of this file: `ModelClient`,
# `ToolGateway` and `Guardrail` each have an in-process implementation, so the
# only thing missing from a CI run is the network.
#
# The evaluation gates are a separate step from the tests, although the tests
# cover them too. A grounding regression should name itself in the job list
# rather than arriving as one more red dot in a run of 330.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Seed
        # The corpus is generated from a fixed seed and is not committed — the
        # generator is the source of truth. Without this step the tool servers
        # have no system of record to read, and everything downstream of them
        # fails for a reason that has nothing to do with the change being tested.
        run: python -m halo.seed.generate

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Tests
        run: pytest -q

      - name: Gates
        # Exits 2 on a grounding, retrieval, fixture, red-team or teardown
        # regression — the last one parses infra/terraform and fails on anything
        # that would survive a destroy, so a NAT gateway cannot arrive with a
        # copied module and start billing.
        # M7's done-when: a regression fails the build rather than reaching a
        # demo. Everything here runs offline, so no credentials and no spend.
        run: halo gate
